<body>

               <a href="#" onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-75"><i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión</a>

        <!-- Main content -->
        <main class="main-content flex-grow-1 ms-250 p-4">
            <!-- Header -->

                    <h1 class="h3 fw-bold mb-0"><i class="fas fa-home me-2 text-primary"></i>Dashboard Profesional</h1>

                </div>
                <div class="user-info d-flex align-items-center gap-3">

            <!-- Acordeón del Dashboard -->

                            <i class="fas fa-chart-bar me-2"></i> Estadísticas Rápidas

                    </h2>
                    <div id="collapseStats" class="accordion-collapse collapse show" aria-labelledby="headingStats" data-bs-parent="#accordionDashboard">

                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="stat-card">
                                        <div class="stat-icon green"><i class="fas fa-calendar-check"></i></div>
                                        <div><div class="stat-value" id="statCitasHoy">0</div><div class="stat-label">Citas Hoy</div></div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="stat-card">
                                        <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
                                        <div><div class="stat-value" id="statPendientes">0</div><div class="stat-label">Citas Pendientes</div></div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>

                <!-- Actividades Recientes -->
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingActivity">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseActivity" aria-expanded="false" aria-controls="collapseActivity">
                            <i class="fas fa-clock me-2"></i> Actividades Recientes
                        </button>
                    </h2>
                    <div id="collapseActivity" class="accordion-collapse collapse" aria-labelledby="headingActivity" data-bs-parent="#accordionDashboard">

                            <div id="actividadContainer">
                                <div class="text-center text-muted py-4">

        </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="/css/components/custom-alerts.css">
<script src="/js/core/shared/alerts.js"></script>
<script src="/js/core/shared/aside.js"></script>
<script src="/js/modules/auth/logout.js"></script>
<script src="/js/core/shared/nombre.usuario.js"></script>
    <script>
async function cargarDashboard() {
    try {
        const res = await fetch('/api/profesional/dashboard', {
            credentials: 'include'
        });
        const data = await res.json();

        if (!data.success) {
            console.error('Error al cargar dashboard:', data.message);
        }

        // Actualizar estadísticas
        document.getElementById('statPacientes').textContent = data.pacientes_activos ?? 0;
        document.getElementById('statCitasHoy').textContent = data.citas_hoy ?? 0;
        document.getElementById('statPendientes').textContent = data.citas_pendientes ?? 0;

        // Obtener actividades de localStorage
        const actividadesLocal = JSON.parse(localStorage.getItem('psyai_actividades_recientes') || '[]');
        
        // Combinar con actividades de la API
        let todasActividades = [];
        
        // Agregar citas de la API
        if (data.actividades && data.actividades.length > 0) {
            todasActividades = data.actividades.map(a => ({
                tipo: 'cita',
                titulo: a.paciente,
                detalle: `${a.tipoCita} - ${a.fecha} ${a.hora}`,
                estado: a.estado,
                timestamp: new Date(`${a.fecha} ${a.hora}`).getTime() || 0
            }));
        }
        
        // Agregar actividades locales (diagnósticos, reportes, etc)
        actividadesLocal.forEach(a => {
            todasActividades.push({
                tipo: a.tipo,
                titulo: a.accion,
                detalle: a.detalle,
                estado: '',
                timestamp: a.timestamp
            });
        });
        
        // Ordenar por timestamp (más reciente primero)
        todasActividades.sort((a, b) => b.timestamp - a.timestamp);
        
        // Limitar a 10 actividades
        todasActividades = todasActividades.slice(0, 10);

        // Renderizar actividades recientes
        const container = document.getElementById('actividadContainer');
        if (todasActividades.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-calendar-times fa-2x mb-2"></i>
                    <div>No hay actividades recientes</div>
                </div>`;
            return;
        }

        const estadoBadge = {
            'Pendiente':   'warning',
            'Confirmada':  'success',
            'Cancelada':   'danger',
            'Completada':  'secondary'
        };

        const tipoIcono = {
            'cita': 'fa-calendar-check text-primary',
            'diagnostico': 'fa-stethoscope text-success',
            'reporte': 'fa-chart-line text-info'
        };

        container.innerHTML = todasActividades.map(a => `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom">
                <div class="actividad-icon">
                    <i class="fas ${tipoIcono[a.tipo] || 'fa-clipboard text-secondary'}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-semibold">${a.titulo}</div>
                    <div class="text-muted small">${a.detalle}</div>
                </div>
                ${a.estado ? `<span class="badge bg-${estadoBadge[a.estado] || 'secondary'}">${a.estado}</span>` : ''}
            </div>
        `).join('');

    } catch (err) {
        console.error('Error de red:', err);
        // Si falla la API, mostrar solo actividades locales
        const actividadesLocal = JSON.parse(localStorage.getItem('psyai_actividades_recientes') || '[]');
        const container = document.getElementById('actividadContainer');
        
        if (actividadesLocal.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-calendar-times fa-2x mb-2"></i>
                    <div>No hay actividades recientes</div>
                </div>`;
            return;
        }
        
        const tipoIcono = {
            'diagnostico': 'fa-stethoscope text-success',
            'reporte': 'fa-chart-line text-info'
        };
        
        container.innerHTML = actividadesLocal.slice(0, 10).map(a => `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom">
                <div class="actividad-icon">
                    <i class="fas ${tipoIcono[a.tipo] || 'fa-clipboard text-secondary'}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-semibold">${a.accion}</div>
                    <div class="text-muted small">${a.detalle}</div>
                </div>
            </div>
        `).join('');
    }
}

// Cargar al entrar a la página
cargarDashboard();

// Escuchar cambios de localStorage desde otras páginas/pestañas
window.addEventListener('storage', (e) => {
    if (e.key === 'psyai_dashboard_update' && e.newValue) {
        cargarDashboard();
    }
});

// Escuchar cambios en la misma pestaña
window.addEventListener('localStorageChange', (e) => {
    if (e.detail.key === 'psyai_dashboard_update') {
        cargarDashboard();
    }
});
</script>

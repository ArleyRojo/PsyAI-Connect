<!DOCTYPE html>
<html lang="es" class="{{ 'dark-mode' if request.cookies.get('theme') == 'dark' else '' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<title>PsyAI Connect | Dashboard Paciente</title>
<link rel="icon" type="image/jpeg" href="/img/Logo.jpg" sizes="any">
<script src="/js/core/shared/theme-inline.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- CSS propios -->
<link rel="stylesheet" href="/css/base/base.css">
<link rel="stylesheet" href="/css/layout/layout.css">
<link rel="stylesheet" href="/css/components/components.css">
<link rel="stylesheet" href="/css/themes/theme.css">
    <link rel="stylesheet" href="/css/pages/patient.css">
    <link rel="stylesheet" href="/responsive/general.css">
    <link rel="stylesheet" href="/responsive/responsive-patient.css">
    <link rel="stylesheet" href="/responsive/responsive-fix.css">
    <script src="/js/core/shared/theme.js"></script>
        <script src="/js/core/shared/localStorage-detector.js"></script>
</head>
<body>
    <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="d-flex">

        <!-- Sidebar -->
        <aside class="sidebar d-flex flex-column position-fixed">
            <div class="sidebar__logo text-center mt-3">
                <img src="/img/Logo.jpg" alt="PsyAI Connect Logo" class="img-fluid rounded-circle" width="100">
                <h5 class="mt-2 fw-bold text-primary">PsyAI Connect</h5>
            </div>
            <nav class="nav flex-column mt-4">
                <a href="patient.dashboard.html" class="nav-link active"><i class="fas fa-home me-2"></i> Dashboard</a>
                <a href="aside-patient/chatbot.html" class="nav-link"><i class="fas fa-robot me-2"></i>Chatbot Emocional</a>
                <a href="aside-patient/agenda-quotes.html" class="nav-link"><i class="fas fa-calendar-alt me-2"></i> Agenda de Citas</a>
                <a href="aside-patient/mensajes.html" class="nav-link"><i class="fas fa-comments me-2"></i> Mensajes</a>
                <a href="aside-patient/evolution.html" class="nav-link"><i class="fas fa-chart-area me-2"></i> Mi Evolución</a>
                <a href="aside-patient/my.profile.html" class="nav-link border-top pt-3 mt-3"><i class="fas fa-user-circle me-2"></i> Mi Perfil</a>
            </nav>
            <div class="sidebar__footer mt-auto mb-3 text-center">
                <div class="theme-switch-container mb-2">
                    <i class="fa-solid fa-sun theme-icon sun" id="sun-icon"></i>
                    <button id="theme-toggle" title="Cambiar modo"></button>
                    <i class="fa-solid fa-moon theme-icon moon" id="moon-icon"></i>
                </div>
                <a href="#" onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-75"><i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión</a>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content flex-grow-1 ms-280 p-4">

            <!-- Header -->
            <header class="main-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 fw-bold mb-0"><i class="fas fa-home me-2 text-primary"></i>Dashboard Paciente</h1>
                    <small class="text-muted">Bienvenido a tu espacio personal</small>
                </div>
                <div class="user-info d-flex align-items-center gap-3">
                    <i class="fas fa-bell text-secondary fs-5"></i>
                    <div data-avatar="inicial" style="width:40px;height:40px;"></div>
                    <span class="fw-semibold" id="nombrePaciente">Hola,</span>
                </div>
            </header>

            <!-- Acordeón del Dashboard -->
            <div class="accordion accordion-responsive mb-4" id="accordionDashboard">

                <!-- Estado Emocional -->
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingEmotional">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseEmotional" aria-expanded="true" aria-controls="collapseEmotional">
                            <i class="fas fa-robot me-2"></i> Estado Emocional
                        </button>
                    </h2>
                    <div id="collapseEmotional" class="accordion-collapse collapse show" aria-labelledby="headingEmotional" data-bs-parent="#accordionDashboard">
                        <div class="accordion-body">
                            <p class="text-muted mb-3">Contenido sobre tu estado emocional y próximos pasos recomendados.</p>
                            <button class="button button--primary" onclick="location.href='aside-patient/chatbot.html'">
                                Ir al Chatbot <i class="fas fa-robot ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Próxima Cita -->
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingAppointment">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAppointment" aria-expanded="false" aria-controls="collapseAppointment">
                            <i class="fas fa-calendar-check me-2"></i> Próxima Cita
                        </button>
                    </h2>
                    <div id="collapseAppointment" class="accordion-collapse collapse" aria-labelledby="headingAppointment" data-bs-parent="#accordionDashboard">
                        <div class="accordion-body">
                            <div id="proximaCitaTexto" class="mb-3">No hay citas agendadas</div>
                            <button class="button button--primary" onclick="location.href='aside-patient/agenda-quotes.html'">
                                Ir a Agenda <i class="fas fa-calendar-alt ms-1"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/modules/auth/auth-guard.js"></script>
    <link rel="stylesheet" href="/responsive/responsive-fix.css">
<link rel="stylesheet" href="/css/components/custom-alerts.css">
    <script src="/js/core/shared/alerts.js"></script>
    <script src="/js/modules/patient/aside.js"></script>
    <script src="/js/modules/auth/logout.js"></script>
    <script src="/js/core/shared/nombre.usuario.js"></script>

    <script>
    async function cargarProximaCita() {
        try {
            const res = await fetch('/api/citas/proxima', { credentials: 'include' });
            const data = await res.json();
            const el = document.getElementById('proximaCitaTexto');
            if (!data.success || !data.cita) {
                el.textContent = 'No hay citas en este momento';
                return;
            }
            el.innerHTML = `<strong>${data.cita.fecha}</strong> a las <strong>${data.cita.hora}</strong> con <strong>${data.cita.profesional}</strong><br><small class="text-muted">${data.cita.tipoCita}</small>`;
        } catch (e) {
            document.getElementById('proximaCitaTexto').textContent = 'No hay citas en este momento';
        }
    }
    cargarProximaCita();
</script>

</body>
</html>

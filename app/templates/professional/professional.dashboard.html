/* ============================================================
   DASHBOARD PROFESIONAL — Design enhancements
   ============================================================ */

/* Header */
.main-header {
    position: relative;
    padding-bottom: 1.25rem;
}
.main-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 70px;
    height: 3px;
    background: linear-gradient(135deg, #0D47A1, #1976D2);
    border-radius: 3px;
}

/* Accordion items */
.accordion-item {
    border: 1px solid var(--color-border-soft, #EAF3FD) !important;
    border-radius: 14px !important;
    overflow: hidden;
    margin-bottom: 0.75rem;
    transition: all 0.22s ease;
    background: var(--color-bg-card, #fff);
}
.accordion-item:hover {
    box-shadow: 0 8px 24px rgba(13,71,161,.08);
    border-color: #90CAF9 !important;
}
.accordion-button {
    font-weight: 700 !important;
    color: var(--color-text-main, #0D1F3C) !important;
    padding: 1rem 1.25rem !important;
    background: var(--color-bg-card, #fff);
    border-radius: 14px !important;
}
.accordion-button i { font-size: 1rem; }
.accordion-button:not(.collapsed) {
    border-bottom: 1px solid var(--color-border-soft, #EAF3FD);
}
.accordion-button:focus {
    box-shadow: none !important;
    border-color: #90CAF9 !important;
}
.accordion-body {
    padding: 1.25rem !important;
}

/* Stat cards */
.stat-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem;
    border-radius: 14px;
    border: 1px solid var(--color-border-soft, #EAF3FD);
    transition: all 0.22s ease;
    background: var(--color-bg-card, #fff);
}
.stat-card:hover {
    box-shadow: 0 8px 24px rgba(13,71,161,.08);
    border-color: #90CAF9 !important;
    transform: translateY(-2px);
}
.stat-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
}
.stat-icon.blue   { background: linear-gradient(135deg,#e3f2fd,#bbdefb); color: #1565C0; }
.stat-icon.green  { background: linear-gradient(135deg,#e8f5e9,#c8e6c9); color: #2e7d32; }
.stat-icon.orange { background: linear-gradient(135deg,#fff3e0,#ffe0b2); color: #e65100; }
.stat-value { font-size: 1.6rem; font-weight: 800; color: var(--color-text-main, #0D1F3C); line-height: 1.2; }
.stat-label { font-size: 0.78rem; color: var(--color-text-muted, #7B92AC); font-weight: 500; }

/* Activity items */
#actividadContainer .d-flex {
    padding: 0.7rem 0 !important;
    border-bottom: 1px solid var(--color-border-soft, #EAF3FD) !important;
    transition: background 0.2s ease;
    border-radius: 6px;
    margin: 0 -0.3rem;
    padding-left: 0.3rem !important;
    padding-right: 0.3rem !important;
}
#actividadContainer .d-flex:hover {
    background: rgba(13,71,161,.04);
    padding-left: 0.6rem !important;
    padding-right: 0.6rem !important;
}
#actividadContainer .d-flex:last-child { border-bottom: none !important; }
.actividad-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-bg-soft, #F0F5FC);
    flex-shrink: 0;
}
.actividad-icon i { font-size: 0.9rem; }

/* Button refresh */
.btn-light.btn-sm {
    border-radius: 10px !important;
    border: 1px solid var(--color-border-soft, #EAF3FD) !important;
    transition: all 0.22s ease !important;
}
.btn-light.btn-sm:hover {
    background: var(--color-accent, #E3F2FD) !important;
    border-color: #90CAF9 !important;
}

/* ============================================================
   DARK MODE
   ============================================================ */
html.dark-mode .accordion-item {
    background: var(--dm-card, #0e1f35);
    border-color: var(--dm-border, #1a3555) !important;
}
html.dark-mode .accordion-item:hover {
    border-color: var(--dm-accent, #90CAF9) !important;
}
html.dark-mode .accordion-button {
    background: var(--dm-card, #0e1f35) !important;
    color: var(--dm-text1, #daeeff) !important;
}
html.dark-mode .accordion-button:not(.collapsed) {
    background: rgba(13, 71, 161, 0.25) !important;
    color: #60a5fa !important;
    border-bottom-color: var(--dm-border, #1a3555) !important;
}
html.dark-mode .stat-card {
    background: var(--dm-card, #0e1f35);
    border-color: var(--dm-border, #1a3555);
}
html.dark-mode .stat-card:hover {
    border-color: var(--dm-accent, #90CAF9) !important;
}
html.dark-mode .stat-value { color: var(--dm-text1, #daeeff); }
html.dark-mode .stat-label { color: var(--dm-muted, #3d607e); }
html.dark-mode .stat-icon.blue   { background: rgba(21,101,192,.2); color: var(--dm-accent, #90CAF9); }
html.dark-mode .stat-icon.green  { background: rgba(46,125,50,.2); color: #66bb6a; }
html.dark-mode .stat-icon.orange { background: rgba(230,81,0,.2); color: #ffa726; }
html.dark-mode #actividadContainer .d-flex { border-bottom-color: var(--dm-border, #1a3555) !important; }
html.dark-mode #actividadContainer .d-flex:hover { background: rgba(144,202,249,.06); }
html.dark-mode .actividad-icon { background: var(--dm-elevated, #132843); }
html.dark-mode .btn-light.btn-sm {
    background: var(--dm-card, #0e1f35);
    border-color: var(--dm-border, #1a3555) !important;
    color: var(--dm-text1, #daeeff) !important;
}
html.dark-mode .btn-light.btn-sm:hover {
    background: rgba(144,202,249,.1) !important;
    border-color: var(--dm-accent, #90CAF9) !important;
}

/* ── Page entrance animation ── */
@keyframes pageFadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.main-content > * {

.main-content > *:nth-child(3) { animation-delay: 0.18s; }
.main-content > *:nth-child(4) { animation-delay: 0.26s; }
.main-content > *:nth-child(5) { animation-delay: 0.34s; }
</style>

    <script>
async function cargarDashboard() {
    try {
        const res = await fetch('/api/profesional/dashboard', {
            credentials: 'include'
        });
        const data = await res.json();

        if (!data.success) {
            console.error('Error al cargar dashboard:', data.message);
        }

        // Actualizar estadísticas
        document.getElementById('statPacientes').textContent = data.pacientes_activos ?? 0;
        document.getElementById('statCitasHoy').textContent = data.citas_hoy ?? 0;
        document.getElementById('statPendientes').textContent = data.citas_pendientes ?? 0;

        // Obtener actividades de localStorage
        const actividadesLocal = JSON.parse(localStorage.getItem('psyai_actividades_recientes') || '[]');
        
        // Combinar con actividades de la API
        let todasActividades = [];
        
        // Agregar citas de la API
        if (data.actividades && data.actividades.length > 0) {
            todasActividades = data.actividades.map(a => ({
                tipo: 'cita',
                titulo: a.paciente,
                detalle: `${a.tipoCita} · ${a.fecha} ${a.hora}`,
                estado: a.estado,
                timestamp: new Date(`${a.fecha} ${a.hora}`).getTime() || 0
            }));
        }
        
        // Agregar actividades locales (diagnósticos, reportes, etc)
        actividadesLocal.forEach(a => {
            todasActividades.push({
                tipo: a.tipo,
                titulo: a.accion,
                detalle: a.detalle,
                estado: '',
                timestamp: a.timestamp
            });
        });
        
        // Ordenar por timestamp (más reciente primero)
        todasActividades.sort((a, b) => b.timestamp - a.timestamp);
        
        // Limitar a 10 actividades
        todasActividades = todasActividades.slice(0, 10);

        // Renderizar actividades recientes
        const container = document.getElementById('actividadContainer');
        if (todasActividades.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-calendar-times fa-2x mb-2"></i>
                    <div>No hay actividades recientes</div>
                </div>`;
            return;
        }

        const estadoBadge = {
            'Pendiente':   'warning',
            'Confirmada':  'success',
            'Cancelada':   'danger',
            'Completada':  'secondary'
        };

        const tipoIcono = {
            'cita': 'fa-calendar-check text-primary',
            'diagnostico': 'fa-stethoscope text-success',
            'reporte': 'fa-chart-line text-info'
        };

        container.innerHTML = todasActividades.map(a => `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom">
                <div class="actividad-icon">
                    <i class="fas ${tipoIcono[a.tipo] || 'fa-clipboard text-secondary'}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-semibold">${a.titulo}</div>
                    <div class="text-muted small">${a.detalle}</div>
                </div>
                ${a.estado ? `<span class="badge bg-${estadoBadge[a.estado] || 'secondary'}">${a.estado}</span>` : ''}
            </div>
        `).join('');

    } catch (err) {
        console.error('Error de red:', err);
        // Si falla la API, mostrar solo actividades locales
        const actividadesLocal = JSON.parse(localStorage.getItem('psyai_actividades_recientes') || '[]');
        const container = document.getElementById('actividadContainer');
        
        if (actividadesLocal.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-4">
                    <i class="fas fa-calendar-times fa-2x mb-2"></i>
                    <div>No hay actividades recientes</div>
                </div>`;
            return;
        }
        
        const tipoIcono = {
            'diagnostico': 'fa-stethoscope text-success',
            'reporte': 'fa-chart-line text-info'
        };
        
        container.innerHTML = actividadesLocal.slice(0, 10).map(a => `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom">
                <div class="actividad-icon">
                    <i class="fas ${tipoIcono[a.tipo] || 'fa-clipboard text-secondary'}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-semibold">${a.accion}</div>
                    <div class="text-muted small">${a.detalle}</div>
                </div>
            </div>
        `).join('');
    }
}

// Cargar al entrar a la página
cargarDashboard();

// Escuchar cambios de localStorage desde otras páginas/pestañas
window.addEventListener('storage', (e) => {
    if (e.key === 'psyai_dashboard_update' && e.newValue) {
        cargarDashboard();
    }
});

// Escuchar cambios en la misma pestaña
window.addEventListener('localStorageChange', (e) => {
    if (e.detail.key === 'psyai_dashboard_update') {
        cargarDashboard();
    }
});
</script>

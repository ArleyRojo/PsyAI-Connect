<!DOCTYPE html>
<html lang="es" class="{{ 'dark-mode' if request.cookies.get('theme', 'dark') == 'dark' else '' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <title>PsyAI Connect | Mensajes con Pacientes</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" sizes="any">
    <script src="/js/core/shared/theme-inline.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/base/base.css">
    <link rel="stylesheet" href="/css/layout/layout.css">
<link rel="stylesheet" href="/css/themes/theme.css">
    <link rel="stylesheet" href="/css/pages/professional.css">
<script src="/js/core/shared/theme.js"></script>
    <script src="/js/core/shared/localStorage-detector.js"></script>
</head>
<body class="aside-professional">

<button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="d-flex w-100">
    <aside class="sidebar d-flex flex-column position-fixed shadow-sm">
        <div class="sidebar__logo text-center mt-3">
            <img src="/img/Logo.webp" alt="PsyAI Connect Logo" class="img-fluid rounded-circle" width="100">
            <h5 class="mt-2 fw-bold text-primary">PsyAI Connect</h5>
        </div>
        <nav class="nav flex-column mt-4">
            <a href="../professional.dashboard.html" class="nav-link"><i class="fas fa-home me-2"></i> Dashboard</a>
            <a href="patients.html" class="nav-link"><i class="fas fa-users me-2"></i> Pacientes y Diagn&oacute;sticos</a>
            <a href="my.agenda.html" class="nav-link"><i class="fas fa-calendar-check me-2"></i> Mi Agenda</a>
            <a href="mensajes.html" class="nav-link active"><i class="fas fa-comments me-2"></i> Mensajes</a>
            <a href="reports.html" class="nav-link"><i class="fas fa-chart-line me-2"></i> Reportes</a>
            <a href="my.profile2.html" class="nav-link mt-3 border-top pt-3"><i class="fas fa-user-circle me-2"></i> Mi Perfil</a>
        </nav>
        <div class="sidebar__footer mt-auto mb-3 text-center">
            <div class="theme-switch-container mb-2">
                <i class="fa-solid fa-sun theme-icon sun" id="sun-icon"></i>
                <button id="theme-toggle" title="Cambiar modo"></button>
                <i class="fa-solid fa-moon theme-icon moon" id="moon-icon"></i>
            </div>
            <a href="#" onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm w-75"><i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesi&oacute;n</a>
        </div>
    </aside>

    <main class="main-content flex-grow-1">
        <header class="main-header d-flex justify-content-between align-items-center mb-3">
            <h1><i class="fas fa-comments me-2"></i> Mensajes con Pacientes</h1>
            <span class="user-greeting" id="nombreProfesional">Hola, Dr(a).</span>
        </header>

                        <section class="chat-wrapper"
                                 data-chat-root
                                 data-list-endpoint="/api/chat/pacientes"
                                 data-list-key="pacientes"
                                 data-messages-endpoint="/api/profesional/chat/mensajes"
                                 data-send-endpoint="/api/profesional/chat/enviar"
                                 data-required-role="profesional"
                                 data-fallback-endpoint="/api/pacientes?limit=500"
                                 data-fallback-key="pacientes"
                                 data-contact-mode="patient"
                                 data-empty-text="Selecciona un paciente para empezar una conversaci&oacute;n">
                            <aside class="chat-sidebar">
                                <div class="chat-sidebar__header">
                                    <div class="panel-header">
                                        <span class="panel-title">Pacientes</span>
                                        <span class="panel-count" id="patientCount">·  0</span>
                                    </div>
                                    <div class="search-wrap chat-search">
                                        <i class="fas fa-search search-icon"></i>
                                        <input type="search" class="chat-search-input search-patients" placeholder="Buscar paciente...">
                                    </div>
                                </div>
                                <div class="chat-list" aria-live="polite"></div>
                            </aside>

                            <section class="chat-panel">
                                <div class="chat-panel-placeholder">
                                    <div class="chat-empty-state">
                                        <div class="chat-empty-icon">
                                            <i class="fas fa-comments"></i>
                                        </div>
                                        <h3 class="chat-empty-title">Tus mensajes</h3>
                                        <p class="chat-empty-sub">Selecciona un paciente de la lista para ver o iniciar una conversaci&oacute;n.</p>
                                    </div>
                                </div>

                                <div class="chat-active-view d-flex flex-column h-100 d-none">
                                    <header class="chat-panel-header">
                                        <button type="button" class="chat-back-btn" aria-label="Volver a conversaciones">
                                            <i class="fas fa-arrow-left"></i>
                                        </button>
                                        <div class="chat-active-avatar"></div>
                                        <div class="chat-header-info">
                                            <h6 class="chat-active-name"></h6>
                                            <small class="chat-active-status"></small>
                                        </div>
                                    </header>

                                    <div class="chat-messages-area" aria-live="polite"></div>

                                    <div class="chat-input-bar">
                                        <textarea class="chat-message-input" rows="1" maxlength="2000" placeholder="Escribe un mensaje..."></textarea>
                                        <button type="button" class="chat-send-btn" aria-label="Enviar mensaje">
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </section>
                        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="/responsive/responsive-professional.css">
<link rel="stylesheet" href="/responsive/responsive-fix.css?v=20260618">
<link rel="stylesheet" href="/css/components/custom-alerts.css">
<script src="/js/core/shared/alerts.js"></script>
<script src="/js/modules/professional/aside.js?v=20260626-sidebar-state"></script>
<script src="/js/modules/auth/logout.js"></script>
<script src="/js/core/shared/nombre.usuario.js"></script>
<script src="/js/modules/shared/direct-chat.js?v=20260522-3"></script>
</body>
</html>

## ──────────────────────────────────────────────────────────────────────────────
# PsyAI Connect — Docker Compose (Development)
# Usage (from project root):
#   docker compose -f install/docker-compose.yml up
#   docker compose -f install/docker-compose.yml up -d
#   docker compose -f install/docker-compose.yml down
#   docker compose -f install/docker-compose.yml logs -f app
#   docker compose -f install/docker-compose.yml exec app bash
#
# Usage (from install/ folder):
#   docker compose up
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Django App ────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: install/Dockerfile
      target: dev
    container_name: psyai_app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-psyai_connect}
      - DB_USER=${DB_USER:-psyai}
      - DB_PASSWORD=${DB_PASSWORD:-psyai_pass}
    volumes:
      # Hot-reload: mount the code so changes reflect immediately
      - ..:/app
      # Persist uploaded documents between container restarts
      - uploads_data:/app/static/uploads
      # Copias de seguridad cifradas (HU-30), compartidas con el scheduler
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psyai_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Programador de tareas (recordatorios de cita, de cobro y notificaciones) ──
  # Ejecuta `python manage.py programador`, que corre sin parar:
  #   cada 5 min: recordatorios de cita (24 h antes), notificaciones programadas del admin
  #               y la copia de seguridad diaria cuando llega la hora (HU-30)
  #   cada hora: recordatorios de facturas pendientes (HU-77)
  # Ver lo que hace:  docker compose -f install/docker-compose.yml logs -f scheduler
  scheduler:
    build:
      context: ..
      dockerfile: install/Dockerfile
      target: dev
    container_name: psyai_scheduler
    # Sin el entrypoint: las migraciones ya las hace el servicio app
    entrypoint: []
    command: ["python", "manage.py", "programador"]
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DEBUG=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-psyai_connect}
      - DB_USER=${DB_USER:-psyai}
      - DB_PASSWORD=${DB_PASSWORD:-psyai_pass}
      - PYTHONUNBUFFERED=1
    volumes:
      - ..:/app
      - backups_data:/app/backups
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psyai_net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: psyai_db
    environment:
      POSTGRES_USER: ${DB_USER:-psyai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-psyai_pass}
      POSTGRES_DB: ${DB_NAME:-psyai_connect}
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-psyai} -d ${DB_NAME:-psyai_connect}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - psyai_net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  psyai_net:
    driver: bridge

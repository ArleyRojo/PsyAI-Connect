# ──────────────────────────────────────────────────────────────────────────────
# PsyAI Connect — Docker Compose (Production Override)
# Usage (from project root):
#   docker compose -f install/docker-compose.yml -f install/docker-compose.prod.yml up -d
#
# Usage (from install/ folder):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overrides the 'app' service to:
#   - Build from the 'prod' target
#   - Use waitress instead of runserver
#   - Not mount code as a volume (baked into image)
#   - Require SECRET_KEY from environment
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Django App (Production) ──────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: install/Dockerfile
      target: prod
      args:
        SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or environment}
    container_name: psyai_app_prod
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DEBUG=0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-psyai_connect}
      - DB_USER=${DB_USER:-psyai}
      - DB_PASSWORD=${DB_PASSWORD:-psyai_pass}
    # No volume mount — code is baked into the image
    # Only mount uploads for persistence
    volumes:
      - uploads_data:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psyai_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Programador de tareas (Production) ───────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: install/Dockerfile
      target: prod
      args:
        SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or environment}
    container_name: psyai_scheduler_prod
    entrypoint: []
    command: ["python", "manage.py", "programador"]
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DEBUG=0
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-psyai_connect}
      - DB_USER=${DB_USER:-psyai}
      - DB_PASSWORD=${DB_PASSWORD:-psyai_pass}
      - PYTHONUNBUFFERED=1
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - psyai_net

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    # In production, consider removing the port mapping (internal only)
    ports: []
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Set DB_USER} -d ${DB_NAME:?Set DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - psyai_net

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En mantenimiento &ndash; PsyAI Connect</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" sizes="any">
    <link rel="stylesheet" href="/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/vendor/font-awesome/css/all.min.css">
    <style>
        :root { --fondo: #eef3fb; --tarjeta: #fff; --texto: #1e293b; --suave: #64748b; --azul: #1565c0; }
        @media (prefers-color-scheme: dark) {
            :root { --fondo: #030610; --tarjeta: #0b1429; --texto: #e8f0f8; --suave: #8aa0bc; --azul: #90caf9; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: var(--fondo); color: var(--texto);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .caja {
            width: min(480px, 100%); padding: 40px 28px; border-radius: 22px; text-align: center;
            background: var(--tarjeta); box-shadow: 0 20px 50px rgba(15, 23, 42, .15);
        }
        .logo { width: 72px; height: 72px; object-fit: contain; }
        .icono { font-size: 34px; color: var(--azul); margin: 16px 0 8px; }
        h1 { margin: 0 0 10px; font-size: 1.5rem; }
        p { margin: 0 0 24px; color: var(--suave); line-height: 1.6; }
        a.boton {
            display: inline-flex; gap: 8px; align-items: center; padding: 11px 22px; border-radius: 12px;
            background: #1565c0; color: #fff; font-weight: 700; text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="caja">
        <img src="/img/Logo.webp" alt="PsyAI Connect" class="logo">
        <div class="icono"><i class="fas fa-screwdriver-wrench"></i></div>
        <h1>Estamos en mantenimiento</h1>
        <p>{{ mensaje }}</p>
        <a class="boton" href="/"><i class="fas fa-rotate-right"></i> Volver a intentar</a>
    </main>
</body>
</html>

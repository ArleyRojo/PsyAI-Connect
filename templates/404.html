<!DOCTYPE html>
<html lang="es" class="{% if request.COOKIES.theme == 'dark' %}dark-mode{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsyAI Connect | Página no encontrada</title>
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/css/base/base.css?v=20260711-1">
    <link rel="stylesheet" href="/css/themes/theme.css?v=20260711-1">
    <script src="/js/core/shared/theme-inline.js?v=20260711-1"></script>
    <style>
        .error-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background:
                radial-gradient(circle at 16% 12%, rgba(144,202,249,.18), transparent 26%),
                radial-gradient(circle at 88% 18%, rgba(13,71,161,.08), transparent 28%),
                linear-gradient(145deg, var(--surface-canvas) 0%, var(--surface-sunken) 100%);
        }
        .error-card {
            text-align: center;
            max-width: 440px;
            width: 100%;
            padding: 3rem 2rem;
            border-radius: var(--r-lg);
            background: rgba(255,255,255,.93);
            backdrop-filter: blur(18px);
            border: 1.5px solid rgba(144,202,249,.3);
            box-shadow: var(--elev-3);
        }
        html.dark-mode .error-card {
            background: rgba(16,27,46,.9);
            border-color: rgba(144,202,249,.12);
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: 6rem;
            font-weight: 700;
            color: var(--brand-500);
            line-height: 1;
            margin-bottom: .5rem;
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: .75rem;
        }
        .error-msg {
            color: var(--text-muted);
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: .7rem 1.6rem;
            border-radius: var(--r-sm);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: .9rem;
            text-decoration: none;
            transition: all .22s ease;
            cursor: pointer;
            border: none;
        }
        .error-btn--primary {
            background: linear-gradient(135deg, var(--brand-700), var(--brand-600));
            color: var(--text-on-brand);
            box-shadow: 0 8px 20px rgba(13,71,161,.22);
        }
        .error-btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(13,71,161,.3);
            color: var(--text-on-brand);
        }
        .error-btn--ghost {
            background: transparent;
            border: 1.5px solid var(--border-default);
            color: var(--text-primary);
        }
        .error-btn--ghost:hover {
            border-color: var(--brand-500);
            color: var(--brand-700);
            background: rgba(144,202,249,.06);
        }
    </style>
</head>
<body>
    <main class="error-shell">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Página no encontrada</h1>
            <p class="error-msg">La página que buscas no existe o fue movida. Verifica la URL o vuelve al inicio.</p>
            <div class="error-actions">
                <a href="/" class="error-btn error-btn--primary">
                    <i class="fas fa-home"></i> Ir al inicio
                </a>
                <a href="javascript:history.back()" class="error-btn error-btn--ghost">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="{% if request.COOKIES.theme == 'dark' %}dark-mode{% endif %}">
<head>
    <title>PsyAI Connect | Error del servidor</title>
    {% include 'base/partials/head.html' %}
    <style>
        .error-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background:
                radial-gradient(circle at 16% 12%, rgba(144,202,249,.18), transparent 26%),
                radial-gradient(circle at 88% 18%, rgba(13,71,161,.08), transparent 28%),
                linear-gradient(145deg, var(--surface-canvas) 0%, var(--surface-sunken) 100%);
        }
        .error-card {
            text-align: center;
            max-width: 440px;
            width: 100%;
            padding: 3rem 2rem;
            border-radius: var(--r-lg);
            background: rgba(255,255,255,.93);
            backdrop-filter: blur(18px);
            border: 1.5px solid rgba(144,202,249,.3);
            box-shadow: var(--elev-3);
        }
        html.dark-mode .error-card {
            background: rgba(16,27,46,.9);
            border-color: rgba(144,202,249,.12);
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: 6rem;
            font-weight: 700;
            color: var(--mood-critical);
            line-height: 1;
            margin-bottom: .5rem;
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: .75rem;
        }
        .error-msg {
            color: var(--text-muted);
            font-size: .95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: .7rem 1.6rem;
            border-radius: var(--r-sm);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: .9rem;
            text-decoration: none;
            transition: all .22s ease;
            cursor: pointer;
            border: none;
        }
        .error-btn--primary {
            background: linear-gradient(135deg, var(--brand-700), var(--brand-600));
            color: var(--text-on-brand);
            box-shadow: 0 8px 20px rgba(13,71,161,.22);
        }
        .error-btn--primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(13,71,161,.3);
            color: var(--text-on-brand);
        }
        .error-btn--ghost {
            background: transparent;
            border: 1.5px solid var(--border-default);
            color: var(--text-primary);
        }
        .error-btn--ghost:hover {
            border-color: var(--brand-500);
            color: var(--brand-700);
            background: rgba(144,202,249,.06);
        }
    </style>
</head>
<body>
    <main class="error-shell">
        <div class="error-card">
            <div class="error-code">500</div>
            <h1 class="error-title">Error del servidor</h1>
            <p class="error-msg">Algo salió mal de nuestro lado. Nuestro equipo ya fue notificado. Intenta de nuevo en unos segundos.</p>
            <div class="error-actions">
                <a href="/" class="error-btn error-btn--primary">
                    <i class="fas fa-home"></i> Ir al inicio
                </a>
                <a href="javascript:location.reload()" class="error-btn error-btn--ghost">
                    <i class="fas fa-redo"></i> Reintentar
                </a>
            </div>
        </div>
    </main>
</body>
</html>

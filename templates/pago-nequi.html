<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago con Nequi / Bre-B</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f8f9fa; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { max-width:400px; width:100%; }
        .qr-img { max-width:100%; height:auto; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0"><i class="fas fa-qrcode me-2"></i>Pagar con Nequi / Bre-B</h4>
        </div>
        <div class="card-body text-center p-4">
            <p class="mb-3">Escanea el código QR desde la app <strong>Nequi</strong> o <strong>Bancolombia (Bre-B)</strong> para realizar el pago.</p>
            <img src="/static/img/qr-nequi.png" alt="QR Nequi / Bre-B" class="qr-img mb-3">
            <p class="text-muted small">Si el QR no carga, verifica tu conexión e intenta de nuevo.</p>
            <a href="javascript:history.back()" class="btn btn-outline-secondary mt-3"><i class="fas fa-arrow-left me-1"></i> Volver</a>
        </div>
        <div class="card-footer text-muted text-center small">
            PsyAI Connect &mdash; Plataforma de bienestar emocional
        </div>
    </div>
</div>
</body>
</html>

name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/orm-repositories]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: psyai_connect_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d psyai_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: psyai_connect_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: github-actions-test-secret-key-not-for-production-123456

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run pytest
        run: pytest
